; PlatformIO project config para el nodo sensor ESP8266.
; Toolchain distinto al resto del repo (ESP-IDF/idf.py): aqui se usa
; PlatformIO + framework Arduino para ESP8266 (xtensa-lx106).
;
; Docs: https://docs.platformio.org/en/latest/platforms/espressif8266.html

[env:nodemcuv2]
platform = espressif8266
; NodeMCU v3 (LoLin) es un ESP-12E igual que el v2: se usa el board nodemcuv2.
board = nodemcuv2
framework = arduino

; Velocidad del monitor serie (coincide con Serial.begin en main.cpp).
monitor_speed = 115200

; Velocidad de subida. 921600 es rapido y estable en NodeMCU con CH340/CP2102.
; Si el flasheo falla, baja a 115200.
upload_speed = 921600

; Descomenta y fija el puerto si PlatformIO no lo autodetecta (ej. COM5 en Windows).
; upload_port = COM5
; monitor_port = COM5

; Librerias. La de DHT arrastra Adafruit Unified Sensor como dependencia,
; pero la fijamos explicita para builds reproducibles.
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8
