; PlatformIO project config para el nodo sensor ESP8266.
; Toolchain distinto al resto del repo (ESP-IDF/idf.py): aqui se usa
; PlatformIO + framework Arduino para ESP8266 (xtensa-lx106).
;
; Docs: https://docs.platformio.org/en/latest/platforms/espressif8266.html

; Credenciales (WiFi y OTA) fuera del fuente, en un archivo ignorado por git.
; Si al compilar da "Invalid value for option extra_configs", falta crearlo:
;   copy secrets.ini.example secrets.ini
[platformio]
extra_configs = secrets.ini

[env:nodemcuv2]
platform = espressif8266
; NodeMCU v3 (LoLin) es un ESP-12E igual que el v2: se usa el board nodemcuv2.
board = nodemcuv2
framework = arduino

; Credenciales inyectadas desde secrets.ini: main.cpp las usa como siempre,
; pero no viven en el fuente ni se versionan.
build_flags =
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASSWORD=\"${secrets.wifi_password}\"
    -DOTA_PASSWORD=\"${secrets.ota_password}\"
    ; Para broker MQTT con auth: descomentá estas dos líneas y agregá
    ; mqtt_user/mqtt_pass a secrets.ini. Comentadas = anónimo (sin auth).
    -DMQTT_USER=\"${secrets.mqtt_user}\"
    -DMQTT_PASS=\"${secrets.mqtt_pass}\"

; Velocidad del monitor serie (coincide con Serial.begin en main.cpp).
monitor_speed = 115200

; Velocidad de subida. 921600 es rapido y estable en NodeMCU con CH340/CP2102.
; Si el flasheo falla, baja a 115200.
upload_speed = 921600

; Descomenta y fija el puerto si PlatformIO no lo autodetecta (ej. COM5 en Windows).
; upload_port = COM5
; monitor_port = COM5

; Librerias. La de DHT arrastra Adafruit Unified Sensor como dependencia,
; pero la fijamos explicita para builds reproducibles.
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    knolleary/PubSubClient@^2.8

; --- Subida por WiFi (OTA), con el nodo ya instalado -------------------------
;
; Entorno aparte para no perder la subida por cable: el de arriba
; (nodemcuv2) sigue siendo el del USB. Se elige con -e:
;
;   pio run -e pieza_ota -t upload     <- por WiFi, sin tocar el nodo
;   pio run -e nodemcuv2 -t upload     <- por cable USB
;
; upload_port acepta el nombre mDNS o la IP. En Windows el .local a veces no
; resuelve; la IP del nodo se ve en la tool Nodos del minitool.
; La clave tiene que coincidir con OTA_PASSWORD en main.cpp.
;
; OJO con el firewall de Windows: tras autenticarse, el nodo se conecta DE VUELTA
; a un puerto que abre el PC para bajarse el firmware. Ese puerto es aleatorio
; por defecto, asi que aca se fija en 3232 para poder autorizarlo con una regla
; angosta (ver README, "Actualizar por WiFi"). Sin esa regla el flasheo muere en
; "Waiting for device... No response from device" aunque la autenticacion pase.
[env:pieza_ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = pieza.local
upload_flags =
    --auth=${secrets.ota_password}
    --host_port=3232
