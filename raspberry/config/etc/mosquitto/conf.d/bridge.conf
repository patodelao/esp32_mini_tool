# bridge.conf — la Pi como puente/espejo del broker primario (opendoor).
#
# El broker primario del home-lab ya NO es la Pi: es el nodo del refri
# (opendoor, 192.168.1.108), que está siempre enchufado. Todos los nodos publican
# allá, así que la red de sensores no depende de que la Pi esté encendida.
#
# Este bridge hace que la Mosquitto de la Pi, CUANDO está prendida, sea un espejo
# de opendoor: recibe y reenvía todo labo/# en ambos sentidos. Sirve para:
#   - persistencia/log local en la Pi (su Mosquitto tiene persistence true),
#   - insumos de la galería / pi_monitor.py (que siguen publicando a localhost),
#   - re-sembrar los retenidos de opendoor si opendoor se reinicia (OTA) mientras
#     la Pi está viva: opendoor guarda los retenidos en RAM y los pierde al
#     rebootear, y el bridge se los devuelve al reconectar.
#
# Con la Pi apagada, opendoor no se entera de nada: sigue siendo el broker.
#
# Instalar en la Pi (ver raspberry/README.md):
#   sudo cp bridge.conf /etc/mosquitto/conf.d/
#   sudo systemctl restart mosquitto
#   mosquitto_sub -h localhost -t 'labo/#' -v     # debe ver el tráfico de la flota

connection homelab-opendoor
address 192.168.1.108:1883

# Espejo bidireccional de todo el namespace del home-lab. QoS 0: la flota publica
# en 0/1 pero el valor que importa es el último (retenido), no la entrega garantizada.
topic labo/# both 0

# cleansession false: al reconectar no se pierden las suscripciones del bridge.
cleansession false

# Reconecta con backoff si opendoor no está (arranque, OTA del refri).
restart_timeout 5 30

# IDs propios y try_private para que Mosquitto y Mongoose no confundan el bridge
# con un lazo (que reenviaría cada mensaje de vuelta al infinito).
remote_clientid pi-bridge
local_clientid  pi-bridge-local
try_private true

# El broker de opendoor AHORA tiene auth (Mongoose valida usuario/clave), así que
# el bridge DEBE autenticarse o queda rechazado — y la Pi se queda sin el tráfico
# de la flota (logger, galería, push, cam_capture, cualquier mosquitto_sub a
# localhost). Poné las MISMAS credenciales que usa la flota.
#
# Van EN CLARO acá (Mosquitto no toma variables de entorno en la config). Por eso
# 'remote_password' abajo es un PLACEHOLDER: editá la copia real en la Pi
# (/etc/mosquitto/conf.d/bridge.conf) con tu clave y NO subas esa a git.
remote_username fleet
remote_password PONE_TU_CLAVE_MQTT
