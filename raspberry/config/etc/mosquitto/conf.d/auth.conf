# auth.conf — autenticación del broker Mosquitto (home-lab).
#
# NO copiar este archivo a /etc/mosquitto/conf.d/ hasta haber creado el archivo
# de contraseñas, o Mosquitto no arranca:
#
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd fleet   # pide la clave 2 veces
#
# MIGRACIÓN sin downtime (ver raspberry/README.md):
#   1) allow_anonymous true  -> los nodos viejos (anónimos) siguen conectando
#      mientras reflasheás uno por uno con credenciales.
#   2) Cuando los 4 nodos ya usan credenciales, cambiar a:
#         allow_anonymous false
#      y recargar:  sudo systemctl restart mosquitto
password_file /etc/mosquitto/passwd
allow_anonymous true
